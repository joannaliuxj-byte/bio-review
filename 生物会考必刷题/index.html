<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>生物会考必刷题</title>
<style>
  /* ── Reset & Base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f5f6fa;
    --card:      #ffffff;
    --primary:   #4f8ef7;
    --primary-d: #3a75e0;
    --success:   #34c97e;
    --danger:    #f25c5c;
    --text:      #1a1a2e;
    --sub:       #6b7280;
    --border:    #e5e7eb;
    --radius:    14px;
    --shadow:    0 2px 12px rgba(0,0,0,.08);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  /* ── Layout ───────────────────────────────────────────────── */
  #app {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    max-width: 680px;
    margin: 0 auto;
  }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    background: var(--card);
    padding: 16px 20px 0;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .header-title h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }

  .progress-text {
    font-size: 13px;
    color: var(--sub);
    white-space: nowrap;
  }

  /* Mode tabs */
  .mode-tabs {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
  }

  .mode-tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--sub);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
    transition: color .2s, border-color .2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .mode-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  .mode-tab .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--danger);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    border-radius: 10px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    margin-left: 5px;
    vertical-align: middle;
  }

  /* ── Main scroll area ─────────────────────────────────────── */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 120px;
  }

  /* ── Question card ────────────────────────────────────────── */
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 14px;
  }

  .question-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .question-num {
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 8px;
    padding: 2px 10px;
  }

  .question-num.wrong-tag {
    background: var(--danger);
  }

  .question-text {
    font-size: 15.5px;
    line-height: 1.75;
    color: var(--text);
  }

  .question-img {
    display: block;
    max-width: 100%;
    border-radius: 10px;
    margin-top: 14px;
    border: 1px solid var(--border);
  }

  /* ── Options ──────────────────────────────────────────────── */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: var(--shadow);
  }

  .option-btn:active { opacity: .85; }

  .option-key {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    transition: background .15s, border-color .15s, color .15s;
  }

  .option-text { flex: 1; line-height: 1.6; }

  /* States after answer */
  .option-btn.correct {
    border-color: var(--success);
    background: #f0fdf7;
  }
  .option-btn.correct .option-key {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }

  .option-btn.wrong {
    border-color: var(--danger);
    background: #fff5f5;
  }
  .option-btn.wrong .option-key {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }

  .option-btn.dimmed {
    opacity: .45;
    pointer-events: none;
  }

  .option-btn:disabled { cursor: default; pointer-events: none; }

  /* ── Analysis panel ───────────────────────────────────────── */
  .analysis-panel {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 14px;
    display: none;
  }

  .analysis-panel.visible { display: block; }

  .analysis-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .analysis-header span {
    font-weight: 700;
    font-size: 14px;
    color: var(--primary);
  }

  .analysis-toggle {
    font-size: 18px;
    color: var(--sub);
    transition: transform .25s;
  }

  .analysis-toggle.open { transform: rotate(180deg); }

  .analysis-body {
    padding: 16px 18px;
    font-size: 14px;
    color: #374151;
    line-height: 1.8;
    display: none;
  }

  .analysis-body.open { display: block; }

  /* ── Bottom action bar ────────────────────────────────────── */
  .action-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 16px max(12px, env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    max-width: 680px;
    margin: 0 auto;
    z-index: 20;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(.97); opacity: .9; }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-outline {
    background: var(--bg);
    color: var(--primary);
    border: 2px solid var(--primary);
  }

  .btn-danger {
    background: var(--danger);
    color: #fff;
  }

  .btn[hidden] { display: none; }

  /* ── Empty state ──────────────────────────────────────────── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
  }

  .empty-state .icon { font-size: 56px; margin-bottom: 16px; }
  .empty-state h2 { font-size: 18px; margin-bottom: 8px; }
  .empty-state p  { font-size: 14px; color: var(--sub); }

  /* ── Finish banner ────────────────────────────────────────── */
  .finish-banner {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 24px;
    text-align: center;
    margin-top: 20px;
  }

  .finish-banner .big-icon { font-size: 60px; margin-bottom: 12px; }
  .finish-banner h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .finish-banner p  { color: var(--sub); font-size: 14px; margin-bottom: 20px; }

  .stat-row {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 24px;
  }

  .stat-item { text-align: center; }
  .stat-num  { font-size: 28px; font-weight: 800; }
  .stat-num.green { color: var(--success); }
  .stat-num.red   { color: var(--danger); }
  .stat-label { font-size: 12px; color: var(--sub); margin-top: 2px; }

  /* ── Progress bar ─────────────────────────────────────────── */
  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    margin-top: 10px;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    transition: width .3s ease;
  }

  /* ── Desktop tweak ────────────────────────────────────────── */
  @media (min-width: 600px) {
    main { padding: 24px 24px 140px; }
    .option-btn { font-size: 15.5px; }
    .action-bar { left: 50%; transform: translateX(-50%); width: 100%; max-width: 680px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-title">
      <h1>生物会考必刷题</h1>
      <span class="progress-text" id="progressText"></span>
    </div>
    <div class="mode-tabs">
      <div class="mode-tab active" id="tabNormal" onclick="switchMode('normal')">
        顺序刷题
      </div>
      <div class="mode-tab" id="tabWrong" onclick="switchMode('wrong')">
        错题重刷<span class="badge" id="wrongBadge" style="display:none">0</span>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
  </header>

  <main id="main"></main>

  <div class="action-bar" id="actionBar">
    <button class="btn btn-outline" id="btnAnalysis" hidden onclick="toggleAnalysis()">查看解析</button>
    <button class="btn btn-primary" id="btnNext" hidden onclick="nextQuestion()">下一题</button>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let allQuestions   = [];
let wrongIds       = new Set(JSON.parse(localStorage.getItem('wrongIds') || '[]'));
let mode           = 'normal';   // 'normal' | 'wrong'
let queue          = [];         // current question order
let cursor         = 0;
let answered       = false;
let analysisOpen   = false;

// Per-session correct tracking (for finish screen)
let sessionCorrect = 0;
let sessionTotal   = 0;

// ── Boot ───────────────────────────────────────────────────────────────────
fetch('questions.json')
  .then(r => r.json())
  .then(data => {
    allQuestions = data;
    startMode('normal');
  })
  .catch(() => {
    document.getElementById('main').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div>' +
      '<h2>加载失败</h2><p>请确认 questions.json 与 index.html 在同一目录下</p></div>';
  });

// ── Mode switching ─────────────────────────────────────────────────────────
function switchMode(m) {
  if (mode === m) return;
  mode = m;
  document.getElementById('tabNormal').classList.toggle('active', m === 'normal');
  document.getElementById('tabWrong').classList.toggle('active',  m === 'wrong');
  startMode(m);
}

function startMode(m) {
  mode = m;
  cursor         = 0;
  answered       = false;
  analysisOpen   = false;
  sessionCorrect = 0;
  sessionTotal   = 0;

  if (m === 'normal') {
    queue = [...allQuestions];
  } else {
    queue = allQuestions.filter(q => wrongIds.has(q.id));
  }

  renderCurrentQuestion();
}

// ── Render ─────────────────────────────────────────────────────────────────
function renderCurrentQuestion() {
  updateBadge();
  const main      = document.getElementById('main');
  const btnAnalysis = document.getElementById('btnAnalysis');
  const btnNext     = document.getElementById('btnNext');

  btnAnalysis.hidden = true;
  btnNext.hidden     = true;
  answered           = false;
  analysisOpen       = false;

  // Empty-state for wrong mode
  if (mode === 'wrong' && queue.length === 0) {
    updateProgressBar(0, 0);
    document.getElementById('progressText').textContent = '';
    main.innerHTML =
      '<div class="empty-state">' +
      '<div class="icon">🎉</div>' +
      '<h2>错题本是空的</h2>' +
      '<p>继续顺序刷题，答错的题会自动加入这里</p>' +
      '</div>';
    return;
  }

  // Finish screen
  if (cursor >= queue.length) {
    renderFinish();
    return;
  }

  const q       = queue[cursor];
  const total   = queue.length;
  const current = cursor + 1;

  updateProgressBar(current, total);
  document.getElementById('progressText').textContent = `${current} / ${total}`;

  const isWrongMode = mode === 'wrong';
  const numTag = isWrongMode
    ? `<span class="question-num wrong-tag">错题 ${q.id}</span>`
    : `<span class="question-num">第 ${q.id} 题</span>`;

  const imgHtml = q.image
    ? `<img class="question-img" src="${q.image}" alt="题目图片" loading="lazy">`
    : '';

  const optionsHtml = q.options.map(o =>
    `<button class="option-btn" id="opt${o.key}" onclick="selectOption('${o.key}')">
       <span class="option-key">${o.key}</span>
       <span class="option-text">${o.text}</span>
     </button>`
  ).join('');

  const analysisHtml = q.analysis
    ? `<div class="analysis-panel" id="analysisPanel">
         <div class="analysis-header">
           <span>📖 解析</span>
           <span class="analysis-toggle" id="analysisToggle">▼</span>
         </div>
         <div class="analysis-body" id="analysisBody">${formatAnalysis(q.analysis)}</div>
       </div>`
    : '';

  main.innerHTML =
    `<div class="question-card">
       <div class="question-meta">${numTag}</div>
       <div class="question-text">${q.question}</div>
       ${imgHtml}
     </div>
     <div class="options-list" id="optionsList">${optionsHtml}</div>
     ${analysisHtml}`;
}

function renderFinish() {
  const btnAnalysis = document.getElementById('btnAnalysis');
  const btnNext     = document.getElementById('btnNext');
  btnAnalysis.hidden = true;
  btnNext.hidden     = true;

  const wrong = sessionTotal - sessionCorrect;
  const pct   = sessionTotal ? Math.round(sessionCorrect / sessionTotal * 100) : 0;
  const icon  = pct >= 80 ? '🏆' : pct >= 60 ? '👍' : '📚';
  const msg   = pct >= 80 ? '太厉害了！' : pct >= 60 ? '还不错，继续加油！' : '再刷一遍吧！';

  document.getElementById('progressText').textContent = `${queue.length} / ${queue.length}`;
  updateProgressBar(queue.length, queue.length);

  document.getElementById('main').innerHTML =
    `<div class="finish-banner">
       <div class="big-icon">${icon}</div>
       <h2>${msg}</h2>
       <p>${mode === 'wrong' ? '错题本刷完啦' : '本轮刷题完成'}</p>
       <div class="stat-row">
         <div class="stat-item">
           <div class="stat-num">${sessionTotal}</div>
           <div class="stat-label">作答</div>
         </div>
         <div class="stat-item">
           <div class="stat-num green">${sessionCorrect}</div>
           <div class="stat-label">答对</div>
         </div>
         <div class="stat-item">
           <div class="stat-num red">${wrong}</div>
           <div class="stat-label">答错</div>
         </div>
         <div class="stat-item">
           <div class="stat-num">${pct}%</div>
           <div class="stat-label">正确率</div>
         </div>
       </div>
       <button class="btn btn-primary" style="width:100%;margin-bottom:10px"
         onclick="startMode('${mode}')">再刷一遍</button>
       ${mode === 'wrong' && wrongIds.size > 0
         ? '' : mode === 'normal' && wrongIds.size > 0
         ? `<button class="btn btn-danger" style="width:100%"
              onclick="switchMode('wrong')">去刷错题 (${wrongIds.size})</button>`
         : ''}
     </div>`;
}

// ── Answer logic ───────────────────────────────────────────────────────────
function selectOption(key) {
  if (answered) return;
  answered = true;
  sessionTotal++;

  const q       = queue[cursor];
  const correct = q.answer;
  const isRight = key === correct;

  if (isRight) {
    sessionCorrect++;
    wrongIds.delete(q.id);
  } else {
    wrongIds.add(q.id);
  }
  saveWrong();

  // Style options
  document.querySelectorAll('.option-btn').forEach(btn => {
    const k = btn.querySelector('.option-key').textContent;
    if (k === correct) {
      btn.classList.add('correct');
    } else if (k === key && !isRight) {
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dimmed');
    }
    btn.disabled = true;
  });

  // Show controls
  const btnAnalysis = document.getElementById('btnAnalysis');
  const btnNext     = document.getElementById('btnNext');

  if (q.analysis) btnAnalysis.hidden = false;
  btnNext.hidden = false;
  btnNext.textContent = cursor + 1 >= queue.length ? '查看结果' : '下一题';

  updateBadge();
}

// ── Analysis toggle ────────────────────────────────────────────────────────
function toggleAnalysis() {
  const panel  = document.getElementById('analysisPanel');
  const body   = document.getElementById('analysisBody');
  const toggle = document.getElementById('analysisToggle');
  if (!panel) return;

  // Show panel + expand body; hide the button so it can't be pressed again
  panel.classList.add('visible');
  body.classList.add('open');
  toggle.classList.add('open');
  document.getElementById('btnAnalysis').hidden = true;

  setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

// ── Navigation ─────────────────────────────────────────────────────────────
function nextQuestion() {
  cursor++;
  renderCurrentQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Helpers ────────────────────────────────────────────────────────────────
function updateProgressBar(current, total) {
  const pct = total ? (current / total * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
}

function updateBadge() {
  const badge = document.getElementById('wrongBadge');
  if (wrongIds.size > 0) {
    badge.textContent = wrongIds.size;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

function saveWrong() {
  localStorage.setItem('wrongIds', JSON.stringify([...wrongIds]));
}

function formatAnalysis(text) {
  // Light formatting: bold 【...】 labels
  return text
    .replace(/【([^】]+)】/g, '<strong>【$1】</strong>')
    .replace(/\n/g, '<br>');
}
</script>
</body>
</html>
